<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bettervid</title>
<style>
  :root {
    --paper: #f3ecdd; --card: #fbf7ee; --ink: #1d1b18; --soft: #6b6458; --line: #ddd3bf;
    --accent: #c8372d; --ok: #2f6b4f;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  a { color: inherit; }
  header { max-width: 1120px; margin: 0 auto; padding: 22px 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header a { font-family: var(--serif); font-size: 26px; font-weight: 700; text-decoration: none; letter-spacing: -0.01em; }
  header span { color: var(--soft); font-size: 14px; }
  main { max-width: 1120px; margin: 0 auto; padding: 0 24px 80px; }
  textarea:focus, input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .compose { padding: 28px 0 48px; max-width: 860px; }
  h1 { font-family: var(--serif); font-size: clamp(32px, 6vw, 52px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 700; }
  .lede { color: var(--soft); font-size: 18px; margin: 0 0 24px; max-width: 640px; }
  textarea { width: 100%; min-height: 120px; padding: 16px 18px; resize: vertical; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 18px; }
  .field { margin-top: 22px; }
  .field > b { display: block; font-size: 15px; margin-bottom: 8px; }
  .field > b small { font-weight: 400; color: var(--soft); margin-left: 6px; }

  /* Style picker: a strip of real previews. Hover or choose one to see it move. */
  .styles { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 10px; margin: 0 -4px; scroll-snap-type: x proximity; }
  .style { flex: none; width: 112px; scroll-snap-align: start; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink); }
  .style .pic { display: block; width: 112px; aspect-ratio: 9 / 16; border-radius: 9px; overflow: hidden; position: relative; background: var(--line); border: 2px solid transparent; }
  .style .pic img, .style .pic video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .style span { display: block; font-size: 13.5px; line-height: 1.25; margin-top: 6px; font-weight: 600; }
  .style small { display: block; font-size: 12px; color: var(--soft); line-height: 1.25; }
  .style[aria-pressed="true"] .pic { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .style:hover .pic { border-color: var(--ink); }
  .style.new .pic { display: flex; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--soft); background: var(--card); font-family: var(--serif); font-size: 17px; line-height: 1.25; padding: 10px; color: var(--ink); }
  .style.new .pic b { display: block; font-size: 34px; line-height: 1; margin-bottom: 6px; }

  .maker { margin-top: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; }
  .maker p { margin: 0 0 10px; color: var(--soft); font-size: 15px; }
  .maker .line { display: flex; gap: 10px; flex-wrap: wrap; }
  .maker input { flex: 1 1 240px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: inherit; }
  .maker ol { margin: 12px 0 0; padding-left: 20px; color: var(--soft); font-size: 15px; }
  .maker ol li:last-child { color: var(--ink); }
  .maker .ideas { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .maker .ideas button { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font: inherit; font-size: 13.5px; color: var(--soft); cursor: pointer; }
  .maker .ideas button:hover { color: var(--ink); border-color: var(--ink); }

  .lengths { display: flex; flex-wrap: wrap; gap: 8px; }
  .lengths label { cursor: pointer; }
  .lengths input { position: absolute; opacity: 0; pointer-events: none; }
  .lengths span { display: inline-block; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 99px; background: var(--card); font-size: 15px; }
  .lengths input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .lengths input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .row { display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
  button.make { background: var(--ink); color: var(--paper); border: 0; border-radius: 8px; padding: 13px 26px; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  button.make:hover { background: var(--accent); }
  button.make:disabled { opacity: 0.5; cursor: wait; }
  details summary { cursor: pointer; color: var(--soft); }
  details select { margin-top: 6px; padding: 8px 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; font: inherit; }
  .error { color: var(--accent); margin-top: 12px; font-weight: 600; min-height: 24px; }
  .note { color: var(--soft); font-size: 14px; }

  h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 16px; }
  .tile { display: block; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .thumb { aspect-ratio: 9 / 16; width: 100%; background: var(--ink); border-radius: 10px; overflow: hidden; display: block; object-fit: cover; }
  .tile:hover .thumb { outline: 3px solid var(--accent); }
  .tile b { display: block; font-family: var(--serif); font-size: 16px; line-height: 1.25; margin-top: 9px; }
  .tile small { color: var(--soft); }

  dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; }
  dialog:focus { outline: none; }
  dialog::backdrop { background: rgba(15, 12, 8, 0.82); }
  .watch { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .watch video { height: min(84vh, 177vw); max-width: 94vw; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; display: block; }
  .watch .bar { display: flex; gap: 18px; color: var(--paper); font-size: 15px; }
  .watch .bar button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }

  .run { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 44px; align-items: start; padding-top: 18px; }
  .stick { position: sticky; top: 18px; }
  .screen { aspect-ratio: 9 / 16; width: 100%; max-height: calc(100vh - 110px); background: var(--ink); color: var(--paper); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; font-family: var(--serif); font-size: 22px; line-height: 1.3; gap: 14px; }
  .screen small { font-family: var(--sans); font-size: 14px; opacity: 0.7; }
  .screen video { width: 100%; height: 100%; display: block; background: #000; }
  .screen.playing { padding: 0; }
  .after { margin-top: 12px; display: flex; gap: 16px; font-size: 15px; color: var(--soft); flex-wrap: wrap; }
  .run h1 { font-size: clamp(28px, 4vw, 40px); }
  .asked { color: var(--soft); margin: 0 0 26px; }
  section { border-top: 1.5px solid var(--line); padding: 18px 0 22px; }
  section h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 10px; }
  section h3 small { font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--soft); margin-left: 8px; }
  ol.steps { list-style: none; margin: 0; padding: 0; }
  ol.steps > li { display: grid; grid-template-columns: 14px 1fr auto; column-gap: 12px; align-items: baseline; padding: 5px 0; color: var(--soft); }
  ol.steps > li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); transform: translateY(1px); }
  ol.steps > li.done { color: var(--ink); }
  ol.steps > li.done::before { background: var(--ok); border-color: var(--ok); }
  ol.steps > li.now { color: var(--ink); font-weight: 650; }
  ol.steps > li.now::before { border-color: var(--accent); background: var(--accent); animation: pulse 1.2s infinite; }
  ol.steps > li.failed::before { background: var(--accent); border-color: var(--accent); }
  ol.steps time { font-size: 13px; color: var(--soft); font-weight: 400; }
  ol.steps ul { grid-column: 2 / 4; margin: 4px 0 2px; padding: 0; list-style: none; font-weight: 400; font-size: 14px; color: var(--soft); }
  ol.steps ul li { overflow-wrap: anywhere; }
  .meter { grid-column: 2 / 4; height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { ol.steps > li.now::before { animation: none; } }
  ul.wishes { margin: 0; padding-left: 20px; }
  .script p { font-family: var(--serif); font-size: 18px; line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 22px; }
  .facts div b { display: block; font-family: var(--serif); font-size: 26px; }
  .facts div { color: var(--soft); font-size: 14px; }
  ul.sources { columns: 2; margin: 0; padding-left: 18px; font-size: 15px; }
  .ticket { margin: 0 0 8px; }
  .ticket b { color: var(--accent); font-weight: 600; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin: -10px 0 22px; }
  .tools button { background: none; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .tools button:hover { background: var(--ink); color: var(--paper); }
  .edit { border-top: 1.5px solid var(--line); padding: 16px 0; }
  .edit h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 10px; }
  .edit input { display: block; width: 100%; max-width: 460px; margin-bottom: 6px; padding: 7px 10px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 6px; font: inherit; }
  .edit .make { margin-top: 8px; }
  @media (max-width: 760px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .run { grid-template-columns: 1fr; gap: 24px; }
    .stick { position: static; }
    .screen { max-width: 340px; margin: 0 auto; }
    ul.sources { columns: 1; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .style, .style .pic { width: 96px; }
  }
</style>
</head>
<body>
<header><a href="#">bettervid</a><span>Say what you want to understand. Get a sourced, narrated video.</span></header>
<main id="app"></main>
<dialog id="watch" aria-label="Watch the video"></dialog>
<script>
const LENGTHS = [["auto", "As long as it needs"], ["short", "Under 1 min"], ["medium", "1 to 3 min"], ["long", "3 to 5 min"], ["longer", "5 to 8 min"]];
const SCRIPT_STEPS = { draft: "first draft", cut: "tightened", review: "after review", final: "final" };
const IDEAS = ["a 1970s science textbook", "sticky notes on a fridge", "museum placards, very calm", "comic book, loud and inky", "old terminal, green on black"];
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const app = document.getElementById("app");
const watch = document.getElementById("watch");
let timer;
let misses = 0;
const chosen = { style: localStorageGet("style") || "collage", length: "auto" };

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== false && v !== null) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== undefined && kid !== null && kid !== false) n.append(kid);
  return n;
}
const api = (path, init) => fetch(path, init).then(async (r) => {
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || "Something went wrong.");
  return body;
});
const post = (path, data) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
const minutes = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s} s`);

// A style card: the still, and its loop playing while it is chosen or under the pointer.
function styleCard(s, onPick) {
  const pic = el("span", { class: "pic", style: `background:${s.paper || "var(--line)"}` }, s.still ? el("img", { src: s.still, alt: "", loading: "lazy" }) : el("span", {}));
  let loop;
  const play = () => {
    if (STILL || !s.loop) return;
    if (!loop) {
      loop = el("video", { src: s.loop, muted: "", loop: "", playsinline: "", preload: "auto", "aria-hidden": "true" });
      loop.muted = true;
      pic.append(loop);
    }
    loop.play().catch(() => {});
  };
  const stop = () => { if (loop && card.getAttribute("aria-pressed") !== "true") { loop.pause(); loop.remove(); loop = undefined; } };
  const card = el("button", { type: "button", class: "style", "aria-pressed": String(chosen.style === s.name), title: s.description || s.label, onclick: () => onPick(s.name), onmouseenter: play, onmouseleave: stop, onfocus: play, onblur: stop },
    pic, el("span", {}, s.label), s.custom ? el("small", {}, "made from words") : null);
  card.play = play;
  card.stop = stop;
  return card;
}

function picker(styles) {
  const strip = el("div", { class: "styles", role: "group", "aria-label": "Style" });
  const holder = el("div");
  const pick = (name) => {
    chosen.style = name;
    localStorageSet("style", name);
    for (const c of strip.querySelectorAll(".style[data-name]")) {
      const on = c.dataset.name === name;
      c.setAttribute("aria-pressed", String(on));
      on ? c.play() : c.stop();
    }
  };
  const add = (s, before) => {
    const c = styleCard(s, pick);
    c.dataset.name = s.name;
    before ? strip.insertBefore(c, before) : strip.append(c);
    return c;
  };
  if (!styles.some((s) => s.name === chosen.style)) chosen.style = styles[0]?.name ?? "collage";
  for (const s of styles) add(s);
  const newCard = el("button", { type: "button", class: "style new", "aria-expanded": "false", onclick: () => toggleMaker() },
    el("span", { class: "pic" }, el("span", {}, el("b", {}, "+"), "Describe your own")), el("span", {}, "Your own look"));
  strip.append(newCard);
  const toggleMaker = () => {
    const open = holder.firstChild;
    newCard.setAttribute("aria-expanded", String(!open));
    if (open) return holder.replaceChildren();
    holder.replaceChildren(maker((s) => {
      const c = add(s, newCard);
      pick(s.name);
      c.scrollIntoView({ behavior: STILL ? "auto" : "smooth", block: "nearest", inline: "center" });
    }));
    holder.querySelector("input").focus();
  };
  requestAnimationFrame(() => {
    const on = strip.querySelector('.style[aria-pressed="true"]');
    if (!on) return;
    on.play();
    const right = on.offsetLeft - strip.offsetLeft + on.offsetWidth;
    if (right > strip.clientWidth) strip.scrollLeft = right - strip.clientWidth + 20;
  });
  return el("div", { class: "field" }, el("b", {}, "Style", el("small", {}, "hover to see it move")), strip, holder);
}

// Make a style from words: Spark writes it, the engine checks it, Spark looks at a test scene and fixes it.
function maker(done) {
  const input = el("input", { type: "text", maxlength: 400, placeholder: "Describe a look, like a 1970s science textbook", "aria-label": "Describe a look" });
  const go = el("button", { class: "make", type: "submit" }, "Create style");
  const steps = el("ol", { "aria-live": "polite" });
  const err = el("div", { class: "error", role: "alert" });
  let poll;
  const follow = async (job) => {
    try {
      const s = await api(`/api/styles/jobs/${job}`);
      steps.replaceChildren(...s.steps.map((t) => el("li", {}, t)));
      if (!s.done) return void (poll = setTimeout(() => follow(job), 1200));
      go.disabled = false;
      if (s.error) return void (err.textContent = s.error);
      steps.append(el("li", {}, `Ready: ${s.style.label}. It is chosen for your video.`));
      if (s.notes) steps.append(el("li", {}, `What it could not get quite right: ${s.notes}`));
      input.value = "";
      done(s.style);
    } catch (e) { err.textContent = e.message; go.disabled = false; }
  };
  const form = el("form", { class: "maker", onsubmit: async (e) => {
    e.preventDefault();
    clearTimeout(poll);
    err.textContent = "";
    steps.replaceChildren();
    go.disabled = true;
    try {
      const { job } = await post("/api/styles", { description: input.value });
      follow(job);
    } catch (e) { err.textContent = e.message; go.disabled = false; }
  } },
    el("p", {}, "Say what it should look like in your own words. A model writes the colors, type, lines and motion, draws a test scene, looks at it and fixes what is off. It takes about a minute."),
    el("div", { class: "line" }, input, go),
    el("div", { class: "ideas" }, IDEAS.map((t) => el("button", { type: "button", onclick: () => { input.value = t; input.focus(); } }, t))),
    steps, err);
  return form;
}

function lengths() {
  return el("div", { class: "field" }, el("b", {}, "Length"),
    el("div", { class: "lengths", role: "radiogroup", "aria-label": "Length" }, LENGTHS.map(([v, t]) =>
      el("label", {}, el("input", { type: "radio", name: "length", value: v, checked: v === chosen.length ? "" : null, onchange: () => (chosen.length = v) }), el("span", {}, t)))));
}

// Finished videos play right here, without leaving the page.
function play(v) {
  const video = el("video", { src: `/videos/${v.id}.mp4`, controls: "", autoplay: "", playsinline: "", preload: "auto", "aria-label": v.title });
  watch.replaceChildren(el("div", { class: "watch" }, video,
    el("div", { class: "bar" }, el("a", { href: `#${v.id}`, onclick: () => watch.close() }, "How it was made"), el("a", { href: `/videos/${v.id}.mp4`, download: `${v.id}.mp4` }, "Download"), el("button", { type: "button", onclick: () => watch.close() }, "Close"))));
  watch.showModal();
}
watch.addEventListener("close", () => watch.querySelector("video")?.pause());
watch.addEventListener("click", (e) => { if (e.target === watch) watch.close(); });

function tile(v) {
  const thumb = el("video", { class: "thumb", src: `/videos/${v.id}.mp4#t=4`, preload: "metadata", muted: "", playsinline: "", "aria-hidden": "true", tabindex: "-1" });
  thumb.muted = true;
  return el("button", { type: "button", class: "tile", onclick: () => play(v),
    onmouseenter: () => { if (!STILL) thumb.play().catch(() => {}); }, onmouseleave: () => thumb.pause() },
    thumb, el("b", {}, v.title), el("small", {}, [v.seconds && minutes(v.seconds), v.style].filter(Boolean).join(", ")));
}

async function home() {
  const [opts, videos] = await Promise.all([api("/api/options"), api("/api/videos")]);
  const prompt = el("textarea", { id: "prompt", placeholder: "How did anyone read the Rosetta Stone?\n\nOr tell it everything: the angle, the tone, what to skip.", "aria-label": "What should the video be about?" });
  const persona = el("select", { "aria-label": "Narrator" }, opts.personas.map((s) => el("option", { value: s.name }, s.label)));
  const err = el("div", { class: "error", role: "alert" });
  const go = el("button", { class: "make", type: "submit" }, "Make the video");
  const form = el("form", { onsubmit: async (e) => {
    e.preventDefault();
    go.disabled = true;
    err.textContent = "";
    try {
      const { id } = await post("/api/videos", { prompt: prompt.value, style: chosen.style, persona: persona.value, length: chosen.length });
      location.hash = id;
    } catch (e) { err.textContent = e.message; go.disabled = false; }
  } }, prompt, picker(opts.styles), lengths(),
    el("div", { class: "row" }, go, el("details", {}, el("summary", {}, "Narrator"), persona)),
    opts.busy ? el("p", { class: "note" }, "A video is being made right now, so a new one will wait until it is done.") : null,
    err);
  const done = videos.filter((v) => v.video);
  const making = videos.filter((v) => v.running);
  app.replaceChildren(
    el("div", { class: "compose" }, el("h1", {}, "Turn a question into a video worth watching."),
      el("p", { class: "lede" }, "It researches the story, writes and narrates it, makes the visuals in the style you pick, and checks its own work. Every fact shows its source."), form),
    making.length ? el("div", { class: "field" }, el("h2", {}, "Being made now"), making.map((v) => el("p", {}, el("a", { href: `#${v.id}` }, v.title)))) : "",
    done.length ? el("div", {}, el("h2", {}, "Made so far"), el("p", { class: "note" }, "Tap one to watch it here."), el("div", { class: "gallery" }, done.map(tile))) : "");
}

function steps(v) {
  return el("ol", { class: "steps" }, v.steps.map((s) => el("li", { class: s.state },
    el("span", {}, s.label),
    el("time", {}, s.state === "done" ? (s.reused ? "reused" : s.seconds !== undefined ? minutes(s.seconds) : "") : s.state === "now" ? "working" : ""),
    s.state === "now" && s.percent !== undefined ? el("div", { class: "meter", role: "progressbar", "aria-valuenow": s.percent, "aria-valuemin": 0, "aria-valuemax": 100 }, el("i", { style: `width:${s.percent}%` })) : null,
    s.details.length && s.state !== "next" ? el("ul", {}, s.details.map((d) => el("li", {}, d))) : null)));
}

function wishes(p) {
  const list = [...(p?.story ?? []), p?.tone && `Tone: ${p.tone}`, ...(p?.visuals ?? []), ...(p?.sound ?? []), p?.seconds && `About ${minutes(p.seconds)}`].filter(Boolean);
  return el("section", {}, el("h3", {}, "The plan"),
    el("p", {}, el("b", {}, p.topic)),
    list.length ? el("ul", { class: "wishes" }, list.map((w) => el("li", {}, w))) : el("p", { class: "asked" }, "You left the rest to it."));
}

function render(v) {
  const keep = app.querySelector(".screen video");
  const now = v.steps.find((s) => s.state === "now");
  const screen = v.video ? keep ?? el("video", { src: `/videos/${v.id}.mp4`, controls: "", playsinline: "", preload: "auto", "aria-label": v.title })
    : v.error ? [v.error] : v.running ? [`${now?.label ?? "Working"}...`, el("small", {}, "This takes a few minutes. You can leave; it will be in the gallery.")] : ["This one did not finish."];
  const parts = [
    el("h1", {}, v.title),
    el("p", { class: "asked" }, v.takeaway ?? v.prompt),
    v.video && !v.running && el("div", { class: "tools" }, el("button", { type: "button", onclick: () => replay(v) }, "Replay how it was made"), v.captions && el("button", { type: "button", onclick: (e) => editCaptions(v, e.target) }, "Edit captions")),
    el("section", {}, el("h3", {}, v.video && !v.running ? "How it was made" : "Making it", el("small", {}, v.style)), steps(v)),
    v.plan && wishes(v.plan),
    v.narration && el("section", { class: "script" }, el("h3", {}, "The script", v.scriptStep && el("small", {}, SCRIPT_STEPS[v.scriptStep] ?? v.scriptStep)), v.narration.split(/\n\s*\n/).map((p) => el("p", {}, p))),
    v.shots && el("section", { class: "facts" }, [[v.facts?.claims, "sourced facts"], [v.shots, "shots"], [v.real, "real images"], [v.generated, "generated"], [v.marks, "drawn marks"], [`$${v.usd.toFixed(2)}`, "cost"]].filter(([n]) => n !== undefined).map(([n, t]) => el("div", {}, el("b", {}, String(n)), t))),
    v.critic && el("section", {}, el("h3", {}, "What the critic said"), el("p", {}, v.critic.verdict), v.critic.tickets.map((t) => el("p", { class: "ticket" }, el("b", {}, "Fixed: "), t.note))),
    v.facts?.sources.length ? el("section", {}, el("h3", {}, "Sources"), el("ul", { class: "sources" }, v.facts.sources.map((s) => el("li", {}, el("a", { href: s.url, target: "_blank", rel: "noreferrer" }, s.title))))) : null,
  ];
  const box = el("div", { class: "screen" + (v.video ? " playing" : "") }, screen);
  const links = v.video ? el("div", { class: "after" }, el("a", { href: `/videos/${v.id}.mp4`, download: `${v.id}.mp4` }, "Download"), el("a", { href: "#" }, "Make another")) : el("div", { class: "after" }, el("a", { href: "#" }, "Back"));
  if (keep && v.video && app.querySelector(".story")) app.querySelector(".story").replaceChildren(...parts.filter(Boolean));
  else app.replaceChildren(el("div", { class: "run" }, el("div", { class: "stick" }, box, links), el("div", { class: "story" }, parts.filter(Boolean))));
}

// Replay: walks through a finished run with no model calls, for when the budget or a rate limit stops new videos.
function replay(v) {
  clearTimeout(timer);
  const shownAfter = { plan: ["plan"], research: ["facts"], writer: ["narration", "scriptStep"], director: ["shots", "real", "generated", "marks"], critic: ["critic"] };
  const done = v.steps.filter((s) => s.state === "done");
  const step = (i) => {
    if (i >= done.length) return route();
    const reached = done.slice(0, i).map((s) => s.key);
    const shown = { ...v, video: false, running: true, error: undefined,
      steps: done.map((s, k) => ({ ...s, details: [], percent: undefined, state: k < i ? "done" : k === i ? "now" : "next" })) };
    for (const [stage, fields] of Object.entries(shownAfter)) if (!reached.includes(stage) && (stage !== "director" || !reached.some((k) => ["timeline", "board", "stage", "scene"].includes(k)))) for (const f of fields) shown[f] = undefined;
    render(shown);
    timer = setTimeout(() => step(i + 1), 1300);
  };
  app.replaceChildren();
  step(0);
}

function editCaptions(v, button) {
  if (app.querySelector(".edit")) return;
  const boxes = v.captions.map((c, i) => el("input", { value: c, "aria-label": `Caption ${i + 1}`, maxlength: 60 }));
  const err = el("div", { class: "error", role: "alert" });
  const save = el("button", { class: "make", type: "submit" }, "Save and re-render");
  const form = el("form", { class: "edit", onsubmit: async (e) => {
    e.preventDefault();
    save.disabled = true;
    err.textContent = "";
    try {
      await post(`/api/videos/${v.id}/captions`, { captions: boxes.map((b) => b.value) });
      app.replaceChildren();
      show(v.id);
    } catch (e) { err.textContent = e.message; save.disabled = false; }
  } }, el("h3", {}, "Captions"), boxes, save, err);
  button.closest(".tools").after(form);
  boxes[0]?.focus();
}

async function show(id) {
  clearTimeout(timer);
  try {
    const v = await api(`/api/videos/${id}`);
    misses = 0;
    render(v);
    if (v.running) timer = setTimeout(() => show(id), 1500);
  } catch (e) {
    // The project file can be mid-write during a run, so try again before giving up.
    if (++misses < 6) {
      timer = setTimeout(() => show(id), 1500);
      return;
    }
    app.replaceChildren(el("div", { class: "compose" }, el("h1", {}, "That video was not found."), el("a", { href: "#" }, "Back to the start")));
  }
}

function route() {
  clearTimeout(timer);
  if (watch.open) watch.close();
  const id = location.hash.slice(1);
  id ? show(id) : home();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
